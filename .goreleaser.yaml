version: 2

# Angepasst fuer den Fork zesoup/kubesleep.
#
# Die Auslieferungskanaele von Y0-L0 brauchen Zugangsdaten, die es hier nicht
# gibt, und die Datei Dockerfile.distroless liegt in diesem Fork nicht:
#
#   - homebrew_casks   -> HOMEBREW_TAP_TOKEN, Tap y0-l0/homebrew-tap
#   - publishers/fury  -> FURY_TOKEN, FURY_ACCOUNT
#   - dockers_v2       -> Dockerfile.distroless fehlt (Fork nutzt Dockerfile)
#
# Sie sind entfernt. Was bleibt, ist die Ausgabe, die die openDesk-Pipeline
# braucht: Archive je Betriebssystem und Architektur samt Pruefsummen.

builds:
  - id: kubesleep
    main: ./cmd/kubesleep/
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -X github.com/Y0-L0/kubesleep/kubesleep/version.Version=v{{ .Version }}
      - -X github.com/Y0-L0/kubesleep/kubesleep/version.Commit={{ .ShortCommit }}
      - -X github.com/Y0-L0/kubesleep/kubesleep/version.BuildDate={{ .Date }}
      - -X github.com/Y0-L0/kubesleep/kubesleep/version.TreeState={{ if .IsGitDirty }}dirty{{ else }}clean{{ end }}

nfpms:
  - id: linux-packages
    package_name: kubesleep
    ids:
      - kubesleep
    vendor: stadimeter
    homepage: https://github.com/zesoup/kubesleep
    maintainer: "y0-l0 <jojo.dev@lohmer.com>"
    description: Suspend and wake Kubernetes workloads on a schedule
    license: AGPL-3.0
    formats:
      - deb
    bindir: /usr/bin

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: 'checksums.txt'

snapshot:
  version_template: "{{ .Tag }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - '^test:'
      - '^chore:'
      - '^ci:'
